name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # PKCS#12 fixture'ları OpenSSL ile üretilir; PDF fixture'ları depoda.
      # Testler eksikse kendileri de üretebilir, ama CI'da açıkça yapıyoruz.
      - name: Test verisi üret
        run: npm run fixtures

      - name: Birim testleri
        run: npm test

      # E2E testleri yerel CA + OCSP + CRL + TSA ayağa kaldırır: ağa çıkmaz.
      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Uyumluluk raporu
        run: npm run conformance:report

      - name: Raporu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.node }}
          path: |
            docs/conformance/RAPOR.md
            docs/conformance/ornekler/
          retention-days: 14

  publish:
    name: npm'e yayınla
    # Yalnız sürüm etiketi itildiğinde ve testler geçtiğinde
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # Paketler birbirine bağımlı: bağımlılık sırasına göre yayınlanır.
      # Zaten yayınlanmış sürümler atlanır (idempotent).
      - name: Paketleri yayınla
        run: node scripts/publish.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
