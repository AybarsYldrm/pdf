<!DOCTYPE html>

<head>

<style>
  body { background-color: #ffffff; color: #000000; font-family: "Times New Roman", Times, serif; margin: 10px; padding: 0; }
  h1 { font-size: 24px; border-bottom: 2px solid #000; padding-bottom: 5px; }

  button:active, .file-btn:active { border-style: inset; }

  textarea { width: 100%; height: 150px; font-family: "Courier New", Courier, monospace; font-size: 12px; border: 1px inset #ccc; background: #fff; resize: vertical; }
  .canvas-container { display: table; width: 100%; }
  .canvas-col { display: table-cell; vertical-align: top; padding-right: 15px; }
  canvas, video { border: 2px solid #000; background: #ccc; max-width: 100%; display: block; margin-top: 5px; }
  .status { font-family: "Courier New", Courier, monospace; font-weight: bold; padding: 5px; border: 1px solid #000; background: #eee; margin-bottom: 10px; }
</style>

<h1>QR Tarayıcı [Debug Motoru v3]</h1>

<div class="status" id="status-bar">Durum: Bekliyor...</div>

    </fieldset>
  </div>
  <div class="canvas-col" style="width: 50%;">
    <fieldset>
      <legend>Binarize Matris & Kilitlenme</legend>
      <canvas id="debug-canvas" style="width: 100%;"></canvas>
      <div style="font-size:12px; margin-top:5px;">* Yeşil çerçeve, katı geometri ve oran testini geçen kilitlenmeyi temsil eder.</div>
    </fieldset>

</div>

  <legend>Sistem Logları & Hata İzleme</legend>

</fieldset>

<script>
/* ============================================================
   DEBUG YARDIMCILARI
   ============================================================ */
const logArea = document.getElementById('debug-log');
function dlog(msg) {
  const time = new Date().toLocaleTimeString('tr-TR');
  logArea.value += `[${time}] ${msg}\n`;
  logArea.scrollTop = logArea.scrollHeight;
}
function clearLog() {
  logArea.value = '';
  dlog('Log temizlendi.');
}
window.dlog = dlog; 

/* ============================================================
   VANILLA JS QR DECODER
   ============================================================ */
const QRDecoder = (() => {

  const GF_EXP = new Uint8Array(512);
  const GF_LOG = new Uint8Array(256);
  (() => {
    let v = 1;
    for (let i = 0; i < 255; i++) {
      GF_EXP[i] = v; GF_LOG[v] = i;
      v <<= 1; if (v & 0x100) v ^= 0x11d;
    }
    for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
  })();

  const gfMul = (a, b) => (a && b) ? GF_EXP[(GF_LOG[a] + GF_LOG[b]) % 255] : 0;
  const gfDiv = (a, b) => { if (!b) throw new Error('GF div/0'); return a ? GF_EXP[(GF_LOG[a] - GF_LOG[b] + 255) % 255] : 0; };
  const gfPow = (x, p) => GF_EXP[(GF_LOG[x] * p) % 255];
  const gfInv = x => GF_EXP[255 - GF_LOG[x]];

  function gfPolyEval(p, x) {
    let y = 0;
    for (let i = 0; i < p.length; i++) y = gfMul(y, x) ^ p[i];
    return y;
  }

  function rsCorrect(msg, nsym) {
    const synd = new Uint8Array(nsym);
    let hasError = false;
    for (let i = 0; i < nsym; i++) {
      synd[i] = gfPolyEval(msg, GF_EXP[i]);
      if (synd[i] !== 0) hasError = true;
    }
    if (!hasError) return msg;

    let C = new Uint8Array([1]), B = new Uint8Array([1]);
    let L = 0, m = 1, b = 1;
    for (let i = 0; i < nsym; i++) {
      let d = synd[i];
      for (let j = 1; j <= L; j++) d ^= gfMul(C[j] || 0, synd[i - j]);
      if (!d) { m++; continue; }
      const T = new Uint8Array(C);
      const coef = gfDiv(d, b);
      const shift = new Uint8Array(m + B.length);
      for (let j = 0; j < B.length; j++) shift[j + m] = gfMul(B[j], coef);
      const nc = new Uint8Array(Math.max(C.length, shift.length));
      for (let j = 0; j < nc.length; j++) nc[j] = (C[j] || 0) ^ (shift[j] || 0);
      if (2 * L <= i) { L = i + 1 - L; B = T; b = d; m = 1; } else m++;
      C = nc;
    }

    const errLoc = [];
    for (let i = 0; i < 256; i++) {
      if (!gfPolyEval(C, GF_EXP[i])) errLoc.push(255 - i);
    }
    if (errLoc.length !== L) throw new Error('RS: Kurtarılamaz hata oranı');

    const corrected = new Uint8Array(msg);
    for (const pos of errLoc) {
      if (pos >= msg.length) throw new Error('RS: Hata konumu sınır dışında');
      let xi = GF_EXP[pos], xi_inv = gfInv(xi), err_loc_prime = 1;
      for (const other of errLoc) {
        if (other !== pos) err_loc_prime = gfMul(err_loc_prime, xi ^ GF_EXP[other]);
      }
      const omega = gfPolyEval(synd.slice().reverse(), xi_inv);
      const magnitude = gfDiv(gfMul(gfPow(xi_inv, 1), omega), err_loc_prime);
      corrected[pos] ^= magnitude;
    }
    return corrected;
  }

  function binarize(data, w, h) {
    const gray = new Uint8Array(w * h);
    for (let i = 0; i < gray.length; i++) {
      const p = i * 4;
      gray[i] = (data[p] * 77 + data[p+1] * 150 + data[p+2] * 29) >> 8;
    }
    const bin = new Uint8Array(w * h);
    // 1. DÜZELTME: Pencere boyutu (hs) 7'den 15'e çıkarıldı. 
    // Kamerada QR kod büyük görünüyorsa küçük modüller birleşmesin diye.
    const hs = 15; 
    const integralSum = new Int32Array(w * h);
    const integralCnt = new Int32Array(w * h);
    
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        integralSum[i] = gray[i]
          + (x > 0 ? integralSum[i-1] : 0) + (y > 0 ? integralSum[i-w] : 0) - (x > 0 && y > 0 ? integralSum[i-w-1] : 0);
        integralCnt[i] = 1
          + (x > 0 ? integralCnt[i-1] : 0) + (y > 0 ? integralCnt[i-w] : 0) - (x > 0 && y > 0 ? integralCnt[i-w-1] : 0);
      }
    }
    
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const x1 = Math.max(0, x - hs), x2 = Math.min(w-1, x + hs);
        const y1 = Math.max(0, y - hs), y2 = Math.min(h-1, y + hs);
        const i11 = y1 > 0 && x1 > 0 ? integralSum[(y1-1)*w+(x1-1)] : 0;
        const i12 = y1 > 0 ? integralSum[(y1-1)*w+x2] : 0;
        const i21 = x1 > 0 ? integralSum[y2*w+(x1-1)] : 0;
        const i22 = integralSum[y2*w+x2];
        const sum = i22 - i21 - i12 + i11;
        const cnt = integralCnt[y2*w+x2]
          - (x1>0 ? integralCnt[y2*w+(x1-1)] : 0) - (y1>0 ? integralCnt[(y1-1)*w+x2] : 0) + (x1>0 && y1>0 ? integralCnt[(y1-1)*w+(x1-1)] : 0);
        
        // 2. DÜZELTME: Eşik (threshold) değeri siyahların kanamasını durdurmak için 0.80'e çekildi.
        bin[y*w+x] = gray[y*w+x] < (sum / cnt) * 0.80 ? 1 : 0;
      }
    }
    return bin;
  }

  function findFinderCenters(bin, w, h) {
    const centers = [];
    const skip = 2;

    for (let y = skip; y < h - skip; y += skip) {
      let st = [0, 0, 0, 0, 0];
      let cs = 0;

      for (let x = 0; x < w; x++) {
        const pix = bin[y * w + x];
        if (pix === 1) { 
          if (cs % 2 === 1) cs++; 
          st[cs]++;
        } else { 
          if (cs % 2 === 0) { 
            if (cs === 4) { 
              if (checkRatio(st)) {
                const tot = st[0] + st[1] + st[2] + st[3] + st[4];
                const cx = x - st[4] - st[3] - (st[2] >> 1);
                const cy = crossCheckV(bin, w, h, y, cx, tot);
                
                if (!isNaN(cy)) {
                  const cxFine = crossCheckH(bin, w, cy | 0, cx, tot);
                  if (!isNaN(cxFine)) {
                    if (!centers.some(c => Math.hypot(c.x - cxFine, c.y - cy) < st[2])) {
                      centers.push({ x: cxFine, y: cy, mod: tot / 7 });
                    }
                  }
                }
                st = [0, 0, 0, 0, 0];
                cs = 0;
              } else {
                st[0] = st[2]; st[1] = st[3]; st[2] = st[4]; st[3] = 1; st[4] = 0;
                cs = 3;
              }
            } else if (cs === 0 && st[0] === 0) {
            } else {
              cs++; st[cs]++;
            }
          } else {
            st[cs]++;
          }
        }
      }
    }
    return centers;
  }

  function checkRatio(s) {
    const t = s[0]+s[1]+s[2]+s[3]+s[4];
    if (t < 7) return false;
    const u = t / 7;
    // 3. DÜZELTME: Hizalama karelerini (Alignment Pattern - 1:1:1:1:1) ana köşe sanmaması için
    // Tolerans 0.75'ten 0.5'e (yani %50 varyans sınırına) daraltıldı ve merkez mutlak suretle büyük olmak zorunda.
    const e = u * 0.5; 
    return Math.abs(u-s[0]) < e && 
           Math.abs(u-s[1]) < e && 
           Math.abs(3*u-s[2]) < (3*e) && 
           Math.abs(u-s[3]) < e && 
           Math.abs(u-s[4]) < e;
  }

  function crossCheckV(bin, w, h, ry, cx, tot) {
    const s = [0,0,0,0,0];
    let y = ry;
    while (y >= 0 && bin[y*w+cx] === 1) { s[2]++; y--; }
    while (y >= 0 && bin[y*w+cx] === 0) { s[1]++; y--; }
    while (y >= 0 && bin[y*w+cx] === 1) { s[0]++; y--; }
    y = ry + 1;
    while (y < h && bin[y*w+cx] === 1) { s[2]++; y++; }
    while (y < h && bin[y*w+cx] === 0) { s[3]++; y++; }
    while (y < h && bin[y*w+cx] === 1) { s[4]++; y++; }
    const t2 = s[0]+s[1]+s[2]+s[3]+s[4];
    if (5 * Math.abs(t2-tot) >= 2*tot) return NaN;
    if (!checkRatio(s)) return NaN;
    return ry - s[2]/2 + (y - ry - s[4] - s[3]) / 2 + s[2]/2;
  }

  function crossCheckH(bin, w, cy, cx, tot) {
    const s = [0,0,0,0,0];
    let x = cx;
    while (x >= 0 && bin[cy*w+x] === 1) { s[2]++; x--; }
    while (x >= 0 && bin[cy*w+x] === 0) { s[1]++; x--; }
    while (x >= 0 && bin[cy*w+x] === 1) { s[0]++; x--; }
    x = cx + 1;
    while (x < w && bin[cy*w+x] === 1) { s[2]++; x++; }
    while (x < w && bin[cy*w+x] === 0) { s[3]++; x++; }
    while (x < w && bin[cy*w+x] === 1) { s[4]++; x++; }
    const t2 = s[0]+s[1]+s[2]+s[3]+s[4];
    if (5 * Math.abs(t2-tot) >= 2*tot) return NaN;
    if (!checkRatio(s)) return NaN;
    return cx - s[2]/2 + (x - cx - s[4] - s[3]) / 2 + s[2]/2;
  }

  function orderFinders(pts) {
    if (pts.length < 3) return null;
    const [a, b, c] = pts;
    const dAB = dist2(a,b), dBC = dist2(b,c), dCA = dist2(c,a);
    let tl, tr, bl;
    if (dAB >= dBC && dAB >= dCA) { tl = c; tr = a; bl = b; }
    else if (dBC >= dAB && dBC >= dCA) { tl = a; tr = b; bl = c; }
    else { tl = b; tr = a; bl = c; }
    const cross = (tr.x-tl.x)*(bl.y-tl.y) - (tr.y-tl.y)*(bl.x-tl.x);
    if (cross < 0) { const t = tr; tr = bl; bl = t; }
    return { tl, tr, bl };
  }
  const dist2 = (a,b) => (a.x-b.x)**2+(a.y-b.y)**2;

  function estimateVersion(tl, tr, bl, modSize) {
    const d1 = Math.sqrt(dist2(tl, tr));
    const d2 = Math.sqrt(dist2(tl, bl));
    const d = (d1 + d2) / 2;
    const modules = Math.round(d / modSize);
    const ver = Math.round((modules - 10) / 4);
    return Math.max(1, Math.min(40, ver));
  }

  function computeHomography(src, dst) {
    const A = [];
    for (let i = 0; i < 4; i++) {
      const [sx, sy] = src[i]; const [dx, dy] = dst[i];
      A.push([-sx,-sy,-1, 0,0,0, dx*sx, dx*sy, dx]);
      A.push([ 0,0,0, -sx,-sy,-1, dy*sx, dy*sy, dy]);
    }
    const h = gaussElim(A);
    return h;
  }

  function gaussElim(A) {
    const m = A.length, n = A[0].length;
    for (let col = 0, row = 0; col < n - 1 && row < m; col++, row++) {
      let maxRow = row;
      for (let r = row+1; r < m; r++) if (Math.abs(A[r][col]) > Math.abs(A[maxRow][col])) maxRow = r;
      [A[row], A[maxRow]] = [A[maxRow], A[row]];
      if (Math.abs(A[row][col]) < 1e-10) { row--; continue; }
      const f = A[row][col];
      for (let c = col; c < n; c++) A[row][c] /= f;
      for (let r = 0; r < m; r++) {
        if (r === row) continue;
        const factor = A[r][col];
        for (let c = col; c < n; c++) A[r][c] -= factor * A[row][c];
      }
    }
    const h = new Array(9);
    for (let i = 0; i < 8; i++) h[i] = A[i][8];
    h[8] = 1;
    return h;
  }

  function applyH(H, x, y) {
    const w = H[6]*x + H[7]*y + H[8];
    return [(H[0]*x + H[1]*y + H[2]) / w, (H[3]*x + H[4]*y + H[5]) / w];
  }

  function sampleBits(bin, w, h, H, size) {
    const grid = new Uint8Array(size * size);
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const [px, py] = applyH(H, c + 0.5, r + 0.5);
        const xi = Math.round(px), yi = Math.round(py);
        if (xi < 0 || xi >= w || yi < 0 || yi >= h) { grid[r*size+c] = 0; continue; }
        grid[r*size+c] = bin[yi*w+xi];
      }
    }
    return grid;
  }

  const FORMAT_MASK = 0b101010000010010;
  function readFormat(grid, size) {
    let fmt1 = 0;
    const pos1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    for (let i = 0; i < 15; i++) { const [r,c] = pos1[i]; fmt1 = (fmt1 << 1) | (grid[r*size+c] & 1); }
    fmt1 ^= FORMAT_MASK;

    let fmt2 = 0;
    const pos2 = [[8, size-1],[8,size-2],[8,size-3],[8,size-4],[8,size-5],[8,size-6],[8,size-7],[size-8,8],[size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]];
    for (let i = 0; i < 15; i++) { const [r,c] = pos2[i]; fmt2 = (fmt2 << 1) | (grid[r*size+c] & 1); }
    fmt2 ^= FORMAT_MASK;

    for (const fmt of [fmt1, fmt2]) {
      if (checkFormatBCH(fmt)) {
        return { ec: (fmt >> 13) & 3, mask: (fmt >> 10) & 7 };
      }
    }
    return bruteForceFormat(fmt1, fmt2);
  }

  function checkFormatBCH(fmt) {
    let v = fmt; const poly = 0x537;
    for (let i = 14; i >= 10; i--) if ((v >> i) & 1) v ^= poly << (i - 10);
    return (v & 0x3ff) === 0;
  }

  function bruteForceFormat(f1, f2) {
    let best = null, bestErr = 99;
    for (let ec = 0; ec < 4; ec++) {
      for (let mask = 0; mask < 8; mask++) {
        const data = (ec << 3) | mask;
        let bits = data << 10, tmp = bits;
        const poly = 0x537;
        for (let i = 14; i >= 10; i--) if ((tmp >> i) & 1) tmp ^= poly << (i - 10);
        const candidate = ((data << 10) | (tmp & 0x3ff)) ^ FORMAT_MASK;
        const err = popcount(candidate ^ f1) + popcount(candidate ^ f2);
        if (err < bestErr) { bestErr = err; best = { ec, mask }; }
      }
    }
    return best;
  }
  const popcount = n => { let c=0; while(n) { c+=n&1; n>>=1; } return c; };

  const MASK_FN = [
    (r,c) => (r+c)%2===0, (r,c) => r%2===0, (r,c) => c%3===0, (r,c) => (r+c)%3===0,
    (r,c) => (Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c) => ((r*c)%2+(r*c)%3)===0,
    (r,c) => (((r*c)%2+(r*c)%3)%2)===0, (r,c) => (((r+c)%2+(r*c)%3)%2)===0,
  ];

  function buildFuncMask(size, version) {
    const fm = new Uint8Array(size * size);
    const mark = (r,c) => { if(r>=0&&r<size&&c>=0&&c<size) fm[r*size+c]=1; };
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) mark(r,c);
    for (let r = 0; r < 9; r++) for (let c = size-8; c < size; c++) mark(r,c);
    for (let r = size-8; r < size; r++) for (let c = 0; c < 9; c++) mark(r,c);
    for (let i = 0; i < size; i++) { mark(6,i); mark(i,6); }
    mark(4*version+9, 8);
    const ap = ALIGN_POS[version];
    if (ap) {
      for (const ay of ap) {
        for (const ax of ap) {
          if ((ax===6&&ay===6)||(ax===6&&ay===size-7)||(ax===size-7&&ay===6)) continue;
          for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++) mark(ay+dr,ax+dc);
        }
      }
    }
    if (version >= 7) {
      for (let r=0;r<6;r++) for (let c=size-11;c<size-8;c++) mark(r,c);
      for (let r=size-11;r<size-8;r++) for (let c=0;c<6;c++) mark(r,c);
    }
    return fm;
  }

  const ALIGN_POS = [[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]]; 
  
  // 4. DÜZELTME: Kullanıcı kodunun Versiyon 7 veya 10'a ulaştığında crash olmasını engellemek için tablo genişletildi.
  const RS_TABLE = {
    1:  { L:[7,[[1,19]]],  M:[10,[[1,16]]],  Q:[13,[[1,13]]],  H:[17,[[1,9]]] },
    2:  { L:[10,[[1,34]]], M:[16,[[1,28]]],  Q:[22,[[1,22]]],  H:[28,[[1,16]]] },
    3:  { L:[15,[[1,55]]], M:[26,[[1,44]]],  Q:[18,[[2,17]]],  H:[22,[[2,13]]] },
    4:  { L:[20,[[1,80]]], M:[18,[[2,32]]],  Q:[26,[[2,24]]],  H:[16,[[4,9]]] },
    5:  { L:[26,[[1,108]]],M:[24,[[2,43]]],  Q:[18,[[2,15],[2,16]]],H:[22,[[2,11],[2,12]]] },
    6:  { L:[18,[[2,68]]], M:[16,[[4,27]]],  Q:[24,[[4,19]]],  H:[28,[[4,15]]] },
    7:  { L:[20,[[2,78]]], M:[18,[[4,31]]],  Q:[18,[[2,14],[4,15]]],H:[26,[[4,13],[1,14]]] },
    8:  { L:[24,[[2,97]]], M:[22,[[2,38],[2,39]]],Q:[22,[[4,18],[2,19]]],H:[26,[[4,14],[2,15]]] },
    9:  { L:[30,[[2,116]]],M:[22,[[3,36],[2,37]]],Q:[20,[[4,16],[4,17]]],H:[24,[[4,12],[4,13]]] },
    10: { L:[18,[[2,68],[2,69]]],M:[26,[[4,43],[1,44]]],Q:[24,[[6,19],[2,20]]],H:[28,[[6,15],[2,16]]] }
  };
  const EC_NAMES = ['M','L','H','Q'];

  function readBits(grid, size, funcMask, maskFn) {
    const bits = []; let upward = true, col = size - 1;
    while (col > 0) {
      if (col === 6) col--;
      for (let i = 0; i < size; i++) {
        const r = upward ? size - 1 - i : i;
        for (let dc = 0; dc < 2; dc++) {
          const c = col - dc;
          if (funcMask[r*size+c]) continue;
          let bit = grid[r*size+c] & 1;
          if (maskFn(r, c)) bit ^= 1;
          bits.push(bit);
        }
      }
      col -= 2; upward = !upward;
    }
    return bits;
  }

  class BitReader {
    constructor(bits) { this.bits = bits; this.pos = 0; }
    read(n) { let v = 0; for (let i = 0; i < n; i++) v = (v << 1) | (this.bits[this.pos++] || 0); return v; }
    get remaining() { return this.bits.length - this.pos; }
  }

  function decodeCodewords(codewords, version, ecKey) {
    const info = RS_TABLE[version]?.[ecKey];
    if (!info) throw new Error('RS Tablosu Desteklenmiyor: v' + version);
    const [ecPerBlock, blockDef] = info;
    const blocks = [];
    for (const [cnt, dataCW] of blockDef) { for (let i = 0; i < cnt; i++) blocks.push({ dataCW, ecPerBlock }); }

    const maxData = Math.max(...blocks.map(b => b.dataCW)), maxEC = ecPerBlock;
    const dataBlocks = blocks.map(b => new Uint8Array(b.dataCW)), ecBlocks = blocks.map(() => new Uint8Array(ecPerBlock));

    let cw = 0;
    for (let i = 0; i < maxData; i++) {
      for (let bi = 0; bi < blocks.length; bi++) if (i < blocks[bi].dataCW) dataBlocks[bi][i] = codewords[cw++];
    }
    for (let i = 0; i < maxEC; i++) {
      for (let bi = 0; bi < blocks.length; bi++) ecBlocks[bi][i] = codewords[cw++];
    }

    const result = [];
    for (let bi = 0; bi < blocks.length; bi++) {
      const full = new Uint8Array([...dataBlocks[bi], ...ecBlocks[bi]]);
      const corrected = rsCorrect(full, ecPerBlock);
      for (let i = 0; i < dataBlocks[bi].length; i++) result.push(corrected[i]);
    }
    return result;
  }

  function decodeSegments(data, version) {
    const br = new BitReader(data.flatMap(b => {
      const bits = []; for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1); return bits;
    }));
    let result = '';
    while (br.remaining > 4) {
      const mode = br.read(4);
      if (mode === 0) break;
      if (mode === 0b0100) { 
        const lenBits = version <= 9 ? 8 : 16;
        const len = br.read(lenBits);
        const bytes = []; for (let i = 0; i < len; i++) bytes.push(br.read(8));
        result += new TextDecoder('utf-8').decode(new Uint8Array(bytes));
      } else { break; }
    }
    return result;
  }

  function decode(imageData) {
    const { data, width: w, height: h } = imageData;
    const bin = binarize(data, w, h);
    const centers = findFinderCenters(bin, w, h);
    
    const debugState = { bin, w, h, centers, validTriangle: null };
    if (centers.length < 3) return { text: null, debug: debugState };

    const triples = [];
    for (let i = 0; i < centers.length - 2; i++)
      for (let j = i+1; j < centers.length - 1; j++)
        for (let k = j+1; k < centers.length; k++)
          triples.push([centers[i], centers[j], centers[k]]);

    for (const triple of triples) {
      try {
        const result = tryDecode(bin, w, h, triple, debugState);
        if (result) return { text: result, debug: debugState };
      } catch(e) { 
        // Gerçek RS hatasını artık görebiliriz
        window.dlog && window.dlog('Hata: ' + e.message); 
      }
    }
    return { text: null, debug: debugState };
  }

  function tryDecode(bin, w, h, triple, debugState) {
    const ordered = orderFinders(triple);
    if (!ordered) return null;
    const { tl, tr, bl } = ordered;

    const dTLTR = Math.sqrt(dist2(tl, tr)); 
    const dTLBL = Math.sqrt(dist2(tl, bl)); 
    const dTRBL = Math.sqrt(dist2(tr, bl)); 

    if (dTLTR < 20 || dTLBL < 20) return null;

    // 5. DÜZELTME: Karekodun iki dik kenarı birbirine "eşit" olmalı. 
    // Önceki 0.25 marjı çok yüksekti, 0.15'e çekildi.
    if (Math.abs(dTLTR - dTLBL) > Math.max(dTLTR, dTLBL) * 0.15) return null;

    // Açı kontrolü: cos(90) = 0 olmalıdır.
    const cosAngle = (dTLTR**2 + dTLBL**2 - dTRBL**2) / (2 * dTLTR * dTLBL);
    if (Math.abs(cosAngle) > 0.15) return null; 

    debugState.validTriangle = { tl, tr, bl };
    
    const avgMod = (tl.mod + tr.mod + bl.mod) / 3;
    const version = estimateVersion(tl, tr, bl, avgMod);
    window.dlog && window.dlog(`>> Geometri Doğrulandı. Çözülüyor (Versiyon: ${version})...`);
    
    const size = 21 + (version - 1) * 4;
    const srcPts = [[tl.x - 3.5*tl.mod, tl.y - 3.5*tl.mod], [tr.x + 3.5*tr.mod, tr.y - 3.5*tr.mod], [tr.x + bl.x - tl.x + 3.5*(tr.mod+bl.mod-tl.mod), tr.y + bl.y - tl.y + 3.5*(tr.mod+bl.mod-tl.mod)], [bl.x - 3.5*bl.mod, bl.y + 3.5*bl.mod]];
    const dstPts = [[0,0],[size,0],[size,size],[0,size]];
    
    const H = computeHomography(dstPts, srcPts); 
    const grid = sampleBits(bin, w, h, H, size);
    const fmt = readFormat(grid, size);
    
    if (!fmt) {
      throw new Error('Maske / Format okunamadı.');
    }
    
    const ecName = EC_NAMES[fmt.ec], funcMask = buildFuncMask(size, version), maskFn = MASK_FN[fmt.mask];
    const bits = readBits(grid, size, funcMask, maskFn);

    const codewords = [];
    for (let i = 0; i + 7 < bits.length; i += 8) {
      let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i+j];
      codewords.push(v);
    }
    const dataBytes = decodeCodewords(codewords, version, ecName);
    const text = decodeSegments(dataBytes, version);
    
    window.dlog && window.dlog(`[BAŞARILI] İçerik çözüldü!`);
    return text && text.length > 0 ? text : null;
  }

  return { decode };
})();

/* ============================================================
   KONTROL VE RENDER MOTORU
   ============================================================ */
const video = document.getElementById('video');
const hiddenCanvas = document.getElementById('hidden-canvas');
const debugCanvas = document.getElementById('debug-canvas');
const hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
const dCtx = debugCanvas.getContext('2d');
const statusBar = document.getElementById('status-bar');
const btnCam = document.getElementById('btn-cam');

let stream = null;
let scanning = false;
let raf = null;
let cooldown = false;
let frameCount = 0;

function setStatus(msg) {
  statusBar.textContent = 'Durum: ' + msg;
}

async function toggleCamera() {
  if (scanning) stopCamera();
  else await startCamera();
}

async function startCamera() {
  setStatus('Kamera başlatılıyor...');
  btnCam.disabled = true;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, advanced: [{ focusMode: 'continuous' }] }
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    btnCam.textContent = 'Durdur';
    btnCam.disabled = false;
    setStatus('Tarama devam ediyor, kamerayı koda hizalayınız.');
    raf = requestAnimationFrame(tick);
  } catch(e) {
    btnCam.disabled = false;
    setStatus('Kamera Hatası: ' + e.message);
  }
}

function stopCamera() {
  scanning = false;
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  btnCam.textContent = 'Kamerayı Aç';
  setStatus('Kamera durduruldu.');
  dCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
}

function tick() {
  if (!scanning) return;
  if (!cooldown && video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
    
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    hiddenCanvas.width = vw; hiddenCanvas.height = vh;
    hCtx.drawImage(video, 0, 0, vw, vh);

    frameCount++;
    if (frameCount % 4 === 0) { 
      const imageData = hCtx.getImageData(0, 0, vw, vh);
      const resultObj = QRDecoder.decode(imageData);
      
      renderDebugInfo(resultObj.debug);

      if (resultObj.text) {
        onFound(resultObj.text);
        return;
      }
    }
  }
  raf = requestAnimationFrame(tick);
}

function renderDebugInfo({ bin, w, h, centers, validTriangle }) {
  if(!w || !h) return;
  debugCanvas.width = w; debugCanvas.height = h;
  const imgData = dCtx.createImageData(w, h);
  
  for (let i = 0; i < bin.length; i++) {
    const color = bin[i] ? 0 : 255;
    const pos = i * 4;
    imgData.data[pos] = color;
    imgData.data[pos+1] = color;
    imgData.data[pos+2] = color;
    imgData.data[pos+3] = 255;
  }
  dCtx.putImageData(imgData, 0, 0);

  if(centers && centers.length > 0) {
    dCtx.fillStyle = '#ff0000';
    for(const c of centers) {
      dCtx.fillRect(c.x - 3, c.y - 3, 6, 6);
    }
  }

  if(validTriangle) {
    dCtx.strokeStyle = '#00ff00';
    dCtx.lineWidth = 3;
    dCtx.beginPath();
    dCtx.moveTo(validTriangle.tl.x, validTriangle.tl.y);
    dCtx.lineTo(validTriangle.tr.x, validTriangle.tr.y);
    dCtx.moveTo(validTriangle.tl.x, validTriangle.tl.y);
    dCtx.lineTo(validTriangle.bl.x, validTriangle.bl.y);
    dCtx.stroke();
  }
}

function onFound(text) {
  cooldown = true;
  setStatus('Karekod yakalandı!');
  dlog('--- TARAMA BAŞARILI ---');
  dlog(text);
  
  setTimeout(() => {
    if (scanning) setStatus('Yeniden taramaya hazır...');
    setTimeout(() => { cooldown = false; raf = requestAnimationFrame(tick); }, 1000);
  }, 2000);
}
</script>
