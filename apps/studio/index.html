<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITFAK Belge Studio</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="app-bar">
  <div class="app-bar__brand">
    <span class="app-bar__mark"></span>
    <span class="app-bar__name">FITFAK <strong>Belge Studio</strong></span>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Çalışma alanları">
    <button class="tab is-active" role="tab" data-tab="design"  aria-selected="true">Tasarla</button>
    <button class="tab" role="tab" data-tab="sign"   aria-selected="false">İmzala</button>
    <button class="tab" role="tab" data-tab="verify" aria-selected="false">Doğrula</button>
  </nav>

  <div class="app-bar__actions">
    <span class="badge badge--lock" id="keyBadge" title="Varsayılan akışta özel anahtarınız tarayıcıdan çıkmaz">
      Anahtar tarayıcıda
    </span>
    <button class="btn btn--ghost" id="themeToggle" type="button" aria-label="Koyu/açık tema">Tema</button>
  </div>
</header>

<main class="workspace">

  <!-- ── SOL PANEL ─────────────────────────────────────────────── -->
  <aside class="panel panel--left" id="leftPanel">

    <!-- Tasarla -->
    <section class="pane" data-pane="design">
      <h2 class="pane__title">Belge</h2>

      <label class="field">
        <span class="field__label">Tema</span>
        <select id="themeSelect" class="input"></select>
      </label>

      <label class="field">
        <span class="field__label">Sayfa</span>
        <select id="pageSize" class="input">
          <option value="A4">A4 dikey</option>
          <option value="A4 landscape">A4 yatay</option>
          <option value="A5">A5 dikey</option>
          <option value="LETTER">Letter</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Başlık</span>
        <input id="docTitle" class="input" type="text" value="Resmî Bilgilendirme Belgesi">
      </label>

      <label class="field">
        <span class="field__label">Belge no</span>
        <input id="docNo" class="input" type="text">
      </label>

      <label class="field field--grow">
        <span class="field__label">HTML içerik</span>
        <textarea id="htmlSource" class="input input--code" spellcheck="false"></textarea>
      </label>

      <div class="pane__actions">
        <button class="btn btn--primary" id="btnRender" type="button">PDF üret</button>
        <button class="btn" id="btnDownload" type="button" disabled>İndir</button>
      </div>
      <p class="hint" id="renderHint">Önizleme, PDF motoruyla <strong>aynı CSS</strong> ile çizilir.</p>
    </section>

    <!-- İmzala -->
    <section class="pane is-hidden" data-pane="sign">
      <h2 class="pane__title">İmza kimliği</h2>

      <label class="field">
        <span class="field__label">PFX / P12 dosyası</span>
        <input id="pfxFile" class="input input--file" type="file" accept=".pfx,.p12">
      </label>

      <label class="field">
        <span class="field__label">Parola</span>
        <input id="pfxPass" class="input" type="password" autocomplete="off">
      </label>

      <button class="btn" id="btnPfxOpen" type="button">Kimlikleri oku</button>

      <div class="identity is-hidden" id="identityBox">
        <select id="identitySelect" class="input"></select>
        <dl class="identity__meta" id="identityMeta"></dl>
      </div>

      <h2 class="pane__title">İmza yuvası</h2>
      <select id="slotSelect" class="input"></select>

      <h2 class="pane__title">Görünüm</h2>
      <label class="field">
        <span class="field__label">Damga şablonu</span>
        <select id="stampTemplate" class="input"></select>
      </label>
      <div class="stamp-preview" id="stampPreview" aria-live="polite"></div>

      <h2 class="pane__title">Seviye</h2>
      <div class="levels" id="levelGroup" role="radiogroup" aria-label="İmza seviyesi">
        <label class="level"><input type="radio" name="level" value="B"><span><b>B-B</b> Temel</span></label>
        <label class="level"><input type="radio" name="level" value="T"><span><b>B-T</b> Zaman damgalı</span></label>
        <label class="level"><input type="radio" name="level" value="LT" checked><span><b>B-LT</b> Uzun vadeli</span></label>
        <label class="level"><input type="radio" name="level" value="LTA"><span><b>B-LTA</b> Arşiv</span></label>
      </div>

      <label class="check">
        <input type="checkbox" id="serverSide">
        <span>PFX'i sunucuda çöz <em>(anahtar sunucuya gider)</em></span>
      </label>

      <div class="pane__actions">
        <button class="btn btn--primary" id="btnSign" type="button" disabled>İmzala</button>
      </div>
      <p class="hint" id="signHint"></p>
    </section>

    <!-- Doğrula -->
    <section class="pane is-hidden" data-pane="verify">
      <h2 class="pane__title">Doğrulanacak belge</h2>
      <label class="field">
        <span class="field__label">PDF yükle</span>
        <input id="verifyFile" class="input input--file" type="file" accept=".pdf">
      </label>
      <label class="check">
        <input type="checkbox" id="allowNetwork">
        <span>Ağ üzerinden iptal sorgusuna izin ver</span>
      </label>
      <div class="pane__actions">
        <button class="btn btn--primary" id="btnVerify" type="button">Doğrula</button>
      </div>
      <p class="hint">LTV verisi gömülü belgeler <strong>çevrimdışı</strong> doğrulanabilir.</p>
    </section>
  </aside>

  <!-- ── TUVAL ─────────────────────────────────────────────────── -->
  <section class="canvas" id="canvasArea">
    <div class="canvas__toolbar">
      <span class="canvas__status" id="canvasStatus">Hazır</span>
      <div class="canvas__zoom">
        <button class="btn btn--icon" id="zoomOut" type="button" aria-label="Uzaklaştır">−</button>
        <span id="zoomLabel">%100</span>
        <button class="btn btn--icon" id="zoomIn" type="button" aria-label="Yakınlaştır">+</button>
      </div>
    </div>
    <div class="canvas__scroll" id="canvasScroll">
      <iframe class="preview" id="preview" title="Belge önizlemesi" sandbox="allow-same-origin"></iframe>
    </div>
  </section>

  <!-- ── SAĞ PANEL ─────────────────────────────────────────────── -->
  <aside class="panel panel--right">
    <h2 class="pane__title">İmza paneli</h2>
    <div id="signaturePanel" class="sigpanel">
      <p class="empty">Henüz doğrulanmış imza yok.</p>
    </div>
  </aside>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
